services:
  media:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: service/.env
        required: false
      - path: .env
        required: false
    environment:
      API_KEY: ${API_KEY:-5fc69c15396451eb6318a4f95ab7853c7534b2ef3e048746f1bb6a9f822c8d1f}
      RAPIDAPI_PROXY_SECRET: ${RAPIDAPI_PROXY_SECRET:-}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-600}
      MAX_FILESIZE: ${MAX_FILESIZE:-200M}
    volumes:
      - media-data:/app/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  media-data:
